name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q TelinovaTV_v1.6.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2
      - run: gradle assembleDebug
        working-directory: TelinovaTV
      - uses: actions/upload-artifact@v4
        with:
          name: TelinovaTV-apk
          path: TelinovaTV/app/build/outputs/apk/debug/app-debug.apk
